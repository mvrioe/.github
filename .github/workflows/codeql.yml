# Reusable CodeQL analysis. Free on public repos; private repos need GitHub Advanced Security.
# Call from a repo: uses: mvrioe/.github/.github/workflows/codeql.yml@<sha>
name: codeql

on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of CodeQL languages, e.g. ["javascript-typescript","actions"]
        type: string
        default: '["actions"]'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
