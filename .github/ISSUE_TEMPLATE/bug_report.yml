name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Don't file it here; use the Security tab (private vulnerability reporting). Never paste secrets, tokens or personal data."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected behavior vs. actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
